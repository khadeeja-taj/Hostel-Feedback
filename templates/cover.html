{% extends "base.html" %}
{% block body %}
<div class="cover cover--center">
  {% include "_navbar.html" %}

  <!-- Moving ticker strip -->
  <div class="ticker" aria-hidden="true">
    <div class="ticker__track">
      {% for _ in range(2) %}
      <span class="ticker__item" data-i18n="tick_anon">Anonymous</span><span class="ticker__sep">◆</span>
      <span class="ticker__item" data-i18n="tick_time">~3 Minutes</span><span class="ticker__sep">◆</span>
      <span class="ticker__item" data-i18n="tick_resp">1,240+ Responses</span><span class="ticker__sep">◆</span>
      <span class="ticker__item" data-i18n="tick_review">Reviewed Monthly</span><span class="ticker__sep">◆</span>
      {% endfor %}
    </div>
  </div>

  <main class="cover__center container">
    <h1 class="cover__title cover__title--center anim" style="--d:.08s">
      <span data-i18n="cover_title_1">Your Voice Shapes</span>
      <span class="cover__outline" data-i18n="cover_title_2">Student Living</span>
    </h1>

    <a href="{{ url_for('role_select') }}" class="btn btn--primary btn--lg cover__cta-btn anim" style="--d:.2s">
      <span data-i18n="getStarted">Get Started</span>
      <span class="cover__cta-arrow" aria-hidden="true">→</span>
    </a>

    <figure class="cover__figure cover__figure--full anim" style="--d:.32s">
      <img src="{{ url_for('static', filename='img/campus.jpg') }}"
           alt="IIUI campus at sunset" class="cover__img--full">
    </figure>
  </main>
</div>
{% endblock %}
