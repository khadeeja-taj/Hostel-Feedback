<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IIUI Hostel Feedback</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css?v=55">
  
</head>
<body>
  
<div class="cover cover--hero">
  

<header class="navbar" id="siteNav">
  <div class="container navbar__inner">
    <a href="/" class="brand" aria-label="IIUI Hostel Feedback — Home">
      <img src="/static/img/iiui-logo.png" alt="IIUI" class="brand__logo-img">
      <span data-i18n="brand">IIUI Hostel Feedback</span>
    </a>

    <button class="navbar__toggle" id="navToggle" type="button"
            aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navMenu">
      <span></span><span></span><span></span>
    </button>

    <nav class="navbar__menu" id="navMenu" aria-label="Primary">
      <ul class="navbar__links">
        <li>
          <a href="/"
             class="navlink is-active" data-i18n="nav_home">Home</a>
        </li>
        <li>
          <a href="/student"
             class="navlink" data-i18n="nav_survey">Survey</a>
        </li>
        
      </ul>

      <div class="navbar__actions">
        <div class="lang-toggle">
          <button type="button" data-lang="en" class="active">EN</button>
          <button type="button" data-lang="ar">عربي</button>
        </div>
        
      </div>
    </nav>
  </div>
</header>

  <!-- Static, evenly-spaced info strip -->
  <div class="ticker ticker--static">
    <div class="ticker__row">
      <span class="ticker__item" data-i18n="cover_note_1">Private &amp; secure</span>
      <span class="ticker__sep">◆</span>
      <span class="ticker__item" data-i18n="cover_note_2">One response per student</span>
      <span class="ticker__sep">◆</span>
      <span class="ticker__item" data-i18n="cover_note_3">Takes ~3 minutes</span>
    </div>
  </div>

  <!-- Image hero: the WHOLE photo is shown (object-fit:contain), with a soft
       blurred copy of the same photo filling any leftover space so the screen
       is full with no crop and no empty band. Art-directed: a taller crop on
       phones, the wide crop on desktop. -->
  <section class="hero-img">
    <picture class="hero-img__bg" aria-hidden="true">
      <source media="(max-width: 900px)" srcset="/static/img/campus-tall.jpg">
      <img src="/static/img/campus-wide.jpg" alt="" loading="eager">
    </picture>
    <picture class="hero-img__photo">
      <source media="(max-width: 900px)" srcset="/static/img/campus-tall.jpg">
      <img src="/static/img/campus-wide.jpg" alt="IIUI campus at sunset" loading="eager">
    </picture>
    <span class="hero-img__scrim" aria-hidden="true"></span>
    <div class="hero-img__content container">
      <div class="hero-txt anim" style="--d:.1s">
        <img src="/static/img/council-logo.png"
             alt="The Supreme Student Advisory Council" class="hero-txt__logo">
        <h1 class="hero-txt__title">
          <span data-i18n="cover_title_1">Your Voice Shapes</span>
          <span class="hero-txt__outline" data-i18n="cover_title_2">Student Living</span>
        </h1>
        <a href="/student" class="btn btn--gold btn--lg hero-txt__cta">
          <span data-i18n="getStarted">Get Started</span>
          <span class="cover__cta-arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </div>
  </section>
</div>

  <script src="/static/js/i18n.js?v=55"></script>
  
</body>
</html>
