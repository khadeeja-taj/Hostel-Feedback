<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IIUI Hostel Feedback</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css?v=42">
  
</head>
<body>
  


<header class="navbar" id="siteNav">
  <div class="container navbar__inner">
    <a href="/" class="brand" aria-label="IIUI Hostel Feedback — Home">
      <img src="/static/img/iiui-logo.png" alt="IIUI" class="brand__logo-img">
      <span data-i18n="brand">IIUI Hostel Feedback</span>
    </a>

    <button class="navbar__toggle" id="navToggle" type="button"
            aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navMenu">
      <span></span><span></span><span></span>
    </button>

    <nav class="navbar__menu" id="navMenu" aria-label="Primary">
      <ul class="navbar__links">
        <li>
          <a href="/"
             class="navlink" data-i18n="nav_home">Home</a>
        </li>
        <li>
          <a href="/student"
             class="navlink" data-i18n="nav_survey">Survey</a>
        </li>
        
      </ul>

      <div class="navbar__actions">
        <div class="lang-toggle">
          <button type="button" data-lang="en" class="active">EN</button>
          <button type="button" data-lang="ar">عربي</button>
        </div>
        
        <a href="/student" class="btn btn--primary btn--sm navbar__cta" data-i18n="getStarted">Get Started</a>
        
      </div>
    </nav>
  </div>
</header>

<div class="container page-back-wrap">
  <a href="/" class="page-back" data-i18n="back">Back</a>
</div>

<div class="center-wrap" style="min-height:calc(100vh - 130px);">
  <div style="width:100%; max-width:760px;">
    <div style="text-align:center; margin-bottom:30px;">
      <h1 data-i18n="role_title">Welcome — please choose how you'll continue</h1>
      <p style="color:var(--muted); margin-top:10px;" data-i18n="role_sub">Students share feedback. Administrators view analytics.</p>
    </div>
    <div class="role-grid">
      <a href="/student" class="role-card role-card--student">
        <div class="role-card__icon">🎓</div>
        <h3 data-i18n="role_student">I'm a Student</h3>
        <p data-i18n="role_student_desc">Share your feedback about hostel services and facilities.</p>
      </a>
      <a href="/admin" class="role-card role-card--admin">
        <div class="role-card__icon">🔐</div>
        <h3 data-i18n="role_admin">Admin Login</h3>
        <p data-i18n="role_admin_desc">Access the private analytics dashboard.</p>
      </a>
    </div>
  </div>
</div>

  <script src="/static/js/i18n.js?v=42"></script>
  
</body>
</html>
