<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IIUI Hostel Feedback</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css?v=41">
  
</head>
<body>
  


<header class="navbar" id="siteNav">
  <div class="container navbar__inner">
    <a href="/" class="brand" aria-label="IIUI Hostel Feedback — Home">
      <img src="/static/img/iiui-logo.png" alt="IIUI" class="brand__logo-img">
      <span data-i18n="brand">IIUI Hostel Feedback</span>
    </a>

    <button class="navbar__toggle" id="navToggle" type="button"
            aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navMenu">
      <span></span><span></span><span></span>
    </button>

    <nav class="navbar__menu" id="navMenu" aria-label="Primary">
      <ul class="navbar__links">
        <li>
          <a href="/"
             class="navlink" data-i18n="nav_home">Home</a>
        </li>
        <li>
          <a href="/student"
             class="navlink" data-i18n="nav_survey">Survey</a>
        </li>
        
        <li>
          <a href="/admin"
             class="navlink is-active" data-i18n="nav_admin">Admin</a>
        </li>
        
      </ul>

      <div class="navbar__actions">
        <div class="lang-toggle">
          <button type="button" data-lang="en" class="active">EN</button>
          <button type="button" data-lang="ar">عربي</button>
        </div>
        
        <a href="/start" class="btn btn--primary btn--sm navbar__cta" data-i18n="getStarted">Get Started</a>
        
      </div>
    </nav>
  </div>
</header>

<div class="container page-back-wrap">
  <a href="/start" class="page-back" data-i18n="back">Back</a>
</div>

<div class="center-wrap" style="min-height:calc(100vh - 130px);">
  <div class="card login-card">
    <div class="login-icon">🔐</div>
    <h2 data-i18n="admin_title">Admin Login</h2>
    <p class="step__lead" data-i18n="admin_lead">Authorized personnel only.</p>
    <div class="alert-box alert-box--err" id="loginAlert" data-i18n="admin_err"></div>

    <div class="field">
      <label data-i18n="admin_user">Username</label>
      <input type="text" id="username" autocomplete="username">
    </div>
    <div class="field">
      <label data-i18n="admin_pass">Password</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>
    <button class="btn btn--primary btn--block" id="btnLogin" data-i18n="admin_signin">Sign In</button>
  </div>
</div>

<script>
  const btnLogin = document.getElementById("btnLogin");
  async function doLogin() {
    document.getElementById("loginAlert").classList.remove("show");
    btnLogin.disabled = true;
    const original = btnLogin.textContent;
    btnLogin.innerHTML = '<span class="spinner"></span>';
    try {
      const res = await fetch("/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        }),
      });
      if (res.ok) { window.location = "/admin/dashboard"; return; }
      document.getElementById("loginAlert").classList.add("show");
    } catch (e) {
      document.getElementById("loginAlert").classList.add("show");
    } finally {
      btnLogin.disabled = false;
      btnLogin.textContent = original;
    }
  }
  btnLogin.addEventListener("click", doLogin);
  document.getElementById("password").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
</script>

  <script src="/static/js/i18n.js?v=41"></script>
  
</body>
</html>
